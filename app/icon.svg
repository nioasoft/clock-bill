<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faff69"/>
      <stop offset="100%" stop-color="#e6eb52"/>
    </linearGradient>
  </defs>

  <!-- Brand surface: electric-yellow rounded square (matches in-app logo) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Decorative clock-tick ring (subtle; reads as texture at large sizes, vanishes at 16px) -->
  <g stroke="#0a0a0a" stroke-linecap="round">
    <!-- minute marks -->
    <g stroke-width="4" opacity="0.12">
      <line x1="362" y1="72.4" x2="354" y2="86.3"/>
      <line x1="439.6" y1="150" x2="425.7" y2="158"/>
      <line x1="439.6" y1="362" x2="425.7" y2="354"/>
      <line x1="362" y1="439.6" x2="354" y2="425.7"/>
      <line x1="150" y1="439.6" x2="158" y2="425.7"/>
      <line x1="72.4" y1="362" x2="86.3" y2="354"/>
      <line x1="72.4" y1="150" x2="86.3" y2="158"/>
      <line x1="150" y1="72.4" x2="158" y2="86.3"/>
    </g>
    <!-- hour marks (12, 3, 6, 9) -->
    <g stroke-width="6" opacity="0.2">
      <line x1="256" y1="44" x2="256" y2="70"/>
      <line x1="468" y1="256" x2="442" y2="256"/>
      <line x1="256" y1="468" x2="256" y2="442"/>
      <line x1="44" y1="256" x2="70" y2="256"/>
    </g>
  </g>

  <!-- Gauge mark (lucide "gauge"), bold black, centered -->
  <g transform="translate(100,74) scale(13)" stroke="#0a0a0a" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
    <path d="m12 14 4-4"/>
  </g>
</svg>
