<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Clock face -->
  <circle cx="240" cy="240" r="150" fill="white" opacity="0.15"/>
  <circle cx="240" cy="240" r="130" fill="white" opacity="0.95"/>
  <circle cx="240" cy="240" r="120" fill="white"/>
  <!-- Clock tick marks -->
  <g stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" opacity="0.3">
    <line x1="240" y1="125" x2="240" y2="140"/><!-- 12 -->
    <line x1="300" y1="140" x2="293" y2="152"/><!-- 1 -->
    <line x1="345" y1="180" x2="333" y2="187"/><!-- 2 -->
    <line x1="355" y1="240" x2="340" y2="240"/><!-- 3 -->
    <line x1="345" y1="300" x2="333" y2="293"/><!-- 4 -->
    <line x1="300" y1="340" x2="293" y2="328"/><!-- 5 -->
    <line x1="240" y1="355" x2="240" y2="340"/><!-- 6 -->
    <line x1="180" y1="340" x2="187" y2="328"/><!-- 7 -->
    <line x1="135" y1="300" x2="147" y2="293"/><!-- 8 -->
    <line x1="125" y1="240" x2="140" y2="240"/><!-- 9 -->
    <line x1="135" y1="180" x2="147" y2="187"/><!-- 10 -->
    <line x1="180" y1="140" x2="187" y2="152"/><!-- 11 -->
  </g>
  <!-- Bold marks at 12, 3, 6, 9 -->
  <g stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="240" y1="125" x2="240" y2="148"/>
    <line x1="355" y1="240" x2="332" y2="240"/>
    <line x1="240" y1="355" x2="240" y2="332"/>
    <line x1="125" y1="240" x2="148" y2="240"/>
  </g>
  <!-- Hour hand (pointing ~10 o'clock) -->
  <line x1="240" y1="240" x2="185" y2="175" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand (pointing ~2 o'clock) -->
  <line x1="240" y1="240" x2="305" y2="170" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="240" cy="240" r="8" fill="#1e3a5f"/>
  <circle cx="240" cy="240" r="4" fill="#2563EB"/>
  <!-- Coin stack (bottom right) -->
  <!-- Coin 3 (bottom) -->
  <ellipse cx="380" cy="400" rx="72" ry="22" fill="#d97706" opacity="0.6"/>
  <ellipse cx="380" cy="390" rx="72" ry="22" fill="url(#coin)"/>
  <rect x="308" y="390" width="144" height="10" fill="#d97706" opacity="0.4"/>
  <!-- Coin 2 -->
  <ellipse cx="380" cy="370" rx="65" ry="20" fill="#d97706" opacity="0.6"/>
  <ellipse cx="380" cy="360" rx="65" ry="20" fill="url(#coin)"/>
  <rect x="315" y="360" width="130" height="10" fill="#d97706" opacity="0.4"/>
  <!-- Coin 1 (top) -->
  <ellipse cx="380" cy="340" rx="58" ry="18" fill="#d97706" opacity="0.6"/>
  <ellipse cx="380" cy="330" rx="58" ry="18" fill="url(#coin)"/>
  <!-- Shekel symbol on top coin -->
  <text x="380" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#92400e" opacity="0.7">&#8362;</text>
</svg>
