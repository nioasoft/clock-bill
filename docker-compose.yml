version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clockbill-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clockbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clockbill}
    ports:
      # Bind to localhost only — never expose the dev DB to the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockbill -d clockbill"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
