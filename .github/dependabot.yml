version: 2
updates:
  # Keep npm dependencies patched (security + version updates).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # @polar-sh/better-auth peer-locks @polar-sh/sdk to ^0.47. Bumping the SDK
      # to 0.48+ breaks `npm install` (ERESOLVE) until better-auth widens its
      # peer range — so hold the SDK on 0.47.x (patches still allowed) and bump
      # both together by hand when better-auth supports the newer SDK.
      - dependency-name: "@polar-sh/sdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # ESLint 10 drops the context.getFilename() API that eslint-config-next's
      # bundled eslint-plugin-react still calls → lint crashes. Hold on 9.x until
      # eslint-config-next ships an ESLint-10-compatible release.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      # Batch low-risk dev/minor bumps into one PR to cut noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
