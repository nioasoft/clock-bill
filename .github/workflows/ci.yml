# GitHub Actions CI/CD Pipeline for Clock-Bill
# This workflow runs tests and builds on every push

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: clockbill_test
          POSTGRES_PASSWORD: clockbill_test
          POSTGRES_DB: clockbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clockbill_test -d clockbill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Actions pinned to full commit SHAs (supply-chain integrity); the trailing
      # comment records the human-readable version. Dependabot keeps them current.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Fail only on high/critical prod advisories. Relax to `critical` if an
        # unfixable upstream high transitive blocks unrelated PRs.
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.18.4
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSL --fail "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --verbose

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Verify account deletion on PostgreSQL
        run: npm run test:integration:account-deletion
        env:
          TEST_DATABASE_URL: postgresql://clockbill_test:clockbill_test@localhost:5432/clockbill_test

      - name: Build project
        run: npm run build
        env:
          # Use mock values for build
          DATABASE_URL: postgresql://test:test@localhost/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # NOTE: Preview deployments are handled by Vercel's native Git integration,
  # not GitHub Actions. The old `deploy-preview` job used amondnet/vercel-action
  # with a VERCEL_TOKEN secret that was never configured, so it failed on every
  # PR ("Input required and not supplied: vercel-token") — pure red-X noise.
  # Removed. To re-enable an action-based preview, add VERCEL_TOKEN / VERCEL_ORG_ID
  # / VERCEL_PROJECT_ID repo secrets and restore the job.
